<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ece6d8"/>
      <stop offset="100%" stop-color="#f5f0e8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Top rule -->
  <rect x="0" y="0" width="1200" height="4" fill="#2a7a5e"/>
  <!-- Bottom rule -->
  <rect x="0" y="626" width="1200" height="4" fill="#2a7a5e"/>

  <!-- Monogram block -->
  <rect x="80" y="160" width="130" height="130" rx="5" fill="#1a1814"/>
  <text x="145" y="244" font-family="'JetBrains Mono', monospace" font-size="58" font-weight="500" fill="#f5f0e8" text-anchor="middle">cg</text>

  <!-- Eyebrow -->
  <text x="240" y="196" font-family="'JetBrains Mono', monospace" font-size="20" fill="#746e66" letter-spacing="4">SOFTWARE ENGINEER</text>

  <!-- Name -->
  <text x="240" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" fill="#1a1814" letter-spacing="-1">Conner Gorman</text>

  <!-- Divider -->
  <rect x="80" y="330" width="1040" height="1" fill="#d4cec4"/>

  <!-- Bio lines -->
  <text x="80" y="392" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#4a4640">Kubernetes platforms · GPU infrastructure · developer tooling</text>
  <text x="80" y="440" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#4a4640">Philosophy of science · gravel roads</text>

  <!-- Divider 2 -->
  <rect x="80" y="498" width="1040" height="1" fill="#d4cec4"/>

  <!-- URL -->
  <text x="80" y="544" font-family="'JetBrains Mono', monospace" font-size="22" fill="#2a7a5e" letter-spacing="1">› connergorman.com</text>
</svg>
